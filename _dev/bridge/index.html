<meta name="robots" content="noindex"><link rel="canonical" href="https://vim-interior.netlify.app/">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#fff;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;text-align:center}
main{padding:24px}h1{font-size:1.2rem;margin:18px 0 8px}p{color:#aaa;font-size:.9rem;line-height:1.7;margin:0 0 16px}a{color:#fff}small{color:#777;letter-spacing:.14em;font-size:.7rem}</style></head>
<body><main><svg width="72" viewBox="360 235 520 515" aria-hidden="true"><path d="M380 372 L630 243 L630 258 L488 334 L488 690 L380 612 Z" fill="#fff"/><path d="M488 690 L640 560 L838 640 L622 742 Z" fill="#c4c0bb"/><path d="M722 325 L868 390 L868 634 L722 580 Z" fill="#8b8580"/><rect x="621" y="246" width="8" height="142" fill="#fff"/><path d="M569 442 A55 55 0 0 1 679 442 Z" fill="#fff"/></svg>
<h1 id="t">VIM は新しいURLに引っ越しました</h1><p id="m">データを引き継いで移動しています…</p><p><a id="go" href="https://vim-interior.netlify.app/">https://vim-interior.netlify.app/</a></p><small>Visual × Interior × Modeling</small></main>
<script>
/* 旧URL（bimini-ihae.netlify.app）：この端末の保存データを新URLへ預けてから移動する。一度移したら、二回目以降はそのまま移動だけ */
(function(){var NEW="https://vim-interior.netlify.app",dest=NEW+location.pathname+location.search,hash=location.hash;
 document.getElementById("go").href=dest+hash;
 function go(extra){var u=dest;if(extra)u+=(u.indexOf("?")<0?"?":"&")+extra;location.replace(u+hash)}
 var d={},n=0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k==="vim-moved")continue;d[k]=localStorage.getItem(k);n++}}catch(e){}
 var moved=false;try{moved=localStorage.getItem("vim-moved")==="1"}catch(e){}
 if(!n||moved){go("");return}
 var s=JSON.stringify(d),C=1400000,parts=[];for(var j=0;j<s.length;j+=C)parts.push(s.slice(j,j+C));if(parts.length>64){go("");return}
 var a=new Uint8Array(16);crypto.getRandomValues(a);var t=Array.prototype.map.call(a,function(b){return("0"+b.toString(16)).slice(-2)}).join("");
 var p=Promise.resolve();parts.forEach(function(c,i){p=p.then(function(){return fetch(NEW+"/api/mig?t="+t+"&i="+i+"&n="+parts.length,{method:"POST",headers:{"Content-Type":"text/plain"},body:c}).then(function(r){if(!r.ok)throw new Error(r.status)})})});
 p.then(function(){try{localStorage.setItem("vim-moved","1")}catch(e){}go("mig="+t+"&mign="+parts.length)}).catch(function(){document.getElementById("m").textContent="データを引き継げませんでした。下のリンクから新しいURLを開いてください（このページをもう一度開くと再挑戦します）。"})})();
</script></body></html>
