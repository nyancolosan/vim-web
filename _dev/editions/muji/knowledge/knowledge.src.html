<title>素材図鑑</title>
<style>
/* Layout: カーテン見積と同じ骨格（白地・エンジ）。上に種類の切り替えと検索、下にカードの一覧 */
:root{
  --bg:#ffffff;--card:#ffffff;--ink:#333333;--sub:#7d7778;--line:#e3dfdf;--fill:#ffffff;
  --acc:#9f2a37;--accink:#ffffff;--accbg:#f9eef0;--ok:#4f6b45;--shadow:rgba(60,30,35,.05);
  --rc:8px;color-scheme:light;
  --f-body:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
main{max-width:720px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header.hd{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:58px}
.back{display:flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:999px;min-height:40px;padding:0 14px 0 8px;font-weight:700;font-size:.85rem}
.hdt{margin-left:auto;text-align:right;line-height:1.25}
.hdt b{display:block;font-size:.95rem}
.hdt small{color:var(--sub);font-size:.7rem}
.seg{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);min-height:40px;font-size:.84rem;padding:0 14px;border-radius:999px;white-space:nowrap}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:700}
.seg button i{font-style:normal;font-size:.7rem;opacity:.8;margin-left:4px}
.src{display:inline-block;font-size:.64rem;font-weight:600;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
input[type=search]{width:100%;margin-top:10px;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--fill);color:var(--ink)}
.lead{font-size:.8rem;color:var(--sub);margin:10px 0 0}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.k{border:1px solid var(--line);border-radius:var(--rc);background:var(--card);box-shadow:0 1px 3px var(--shadow)}
.k>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
.k>summary::-webkit-details-marker{display:none}
.k>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);margin-right:4px}
.k[open]>summary::after{transform:rotate(-135deg)}
.chip{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.chip svg{width:24px;height:24px}
.k .t b{display:block;font-size:.95rem}
.k .t span{display:block;font-size:.78rem;color:var(--sub);line-height:1.45}
.k .bd{padding:0 14px 14px 66px}
.k dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;font-size:.84rem}
.k dt{color:var(--sub);white-space:nowrap}
.k dd{margin:0;max-width:60ch}
.say{margin-top:10px;padding:8px 12px;border-left:3px solid var(--acc);background:var(--accbg);font-size:.84rem;border-radius:0 6px 6px 0}
.say::before{content:"接客のひとこと";display:block;font-size:.68rem;color:var(--acc);font-weight:700;letter-spacing:.04em}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.68rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:var(--card)}
.tag.fx{border-color:var(--ok);color:var(--ok)}
.empty{padding:24px;color:var(--sub);text-align:center;font-size:.86rem}
.note{font-size:.72rem;color:var(--sub);margin-top:18px;line-height:1.7}
table{border-collapse:collapse;width:100%;font-size:.8rem;margin-top:4px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--accbg);font-weight:600;white-space:nowrap}
@media (max-width:420px){.k .bd{padding-left:14px}}
</style>

<header class="hd">

</main>
