main{max-width:640px;margin:0 auto;padding:0 14px}

.mock{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:.76rem;line-height:1.6}

.sr{display:flex;gap:8px;margin:10px 0}

.mw{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px}

.zm{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:.8rem}.zm button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:transparent;font-size:1.1rem}.zm small{margin-left:auto;color:var(--sub);font-size:.7rem}
.sp{cursor:pointer}.sp circle.c{fill:#575356;stroke:none;transition:fill .15s}
.sp:hover circle.c{fill:#6a6568}
.sp.hit circle.c{fill:#fff}.sp.hit .ic{stroke:#6b1424}.sp.hit text{fill:#6b1424}
.sp.dim{opacity:.28}
.sp.sel circle.ring{stroke:#fff;stroke-width:5;fill:none}
.sp circle.ring{fill:none;stroke:none}
.ic{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sp text{fill:#fff;font-size:15px;text-anchor:middle;font-weight:600}

.note{font-size:.72rem;color:var(--sub);margin:14px 2px 0;line-height:1.7}

</main>
