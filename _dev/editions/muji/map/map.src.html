<title>店舗マップ（β版・AM川口のみ）</title>
<style>
:root{--bg:#6b1424;--ink:#fff;--sub:#e6c9cf;color-scheme:dark;--f-body:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hd{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:58px;border-bottom:1px solid rgba(255,255,255,.18)}
.back{display:flex;align-items:center;gap:2px;border:1px solid rgba(255,255,255,.5);background:transparent;border-radius:999px;min-height:40px;padding:0 14px 0 8px;font-weight:700;font-size:.85rem}
.hdt{margin-left:auto;text-align:right;line-height:1.25}.hdt b{display:block;font-size:.95rem}.hdt small{color:var(--sub);font-size:.7rem}
main{max-width:1100px;margin:0 auto;padding:0 14px}
.mock{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:.76rem;line-height:1.6}
.ttl{font-size:clamp(26px,8vw,40px);font-weight:800;letter-spacing:.12em;text-align:center;margin:16px 0 2px}
.sub{text-align:center;color:var(--sub);font-size:.8rem;margin:0 0 8px}
.sr{display:flex;gap:8px;margin:10px 0}
.sr input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:0;border-radius:10px;background:#fff;color:#333}
.tools{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:.8rem;flex-wrap:wrap}
.tools button{min-width:38px;height:38px;border-radius:19px;border:1px solid rgba(255,255,255,.5);background:transparent;padding:0 12px}
.tools button.on{background:#fff;color:#6b1424;font-weight:700}
.tools small{margin-left:auto;color:var(--sub);font-size:.7rem}
.mw{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
svg.map{display:block;width:180%;height:auto;max-width:none}
.zn{cursor:pointer}
.zn polygon{fill:#a7a4a5;stroke:#6b1424;stroke-width:2.5;transition:fill .15s}
.zn:hover polygon{fill:#bdbabb}
.zn text{fill:#fff;font-weight:700;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#4a4547;stroke-width:3px;stroke-linejoin:round}
.zn.un text{fill:#e9e6e7;font-weight:500}
.zn.hit polygon{fill:#fff}.zn.hit text{fill:#6b1424;stroke:#fff}
.zn.dim{opacity:.3}
.zn.sel polygon{stroke:#fff;stroke-width:4}
.ov .zn polygon{fill-opacity:.55}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;color:#333;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.35);max-width:640px;margin:0 auto}
.sheet h3{margin:0 0 6px;font-size:.8rem;color:#777;font-weight:600}
.sheet .nm{display:flex;gap:8px}
.sheet input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:1.5px solid #ddd;border-radius:10px;color:#333;background:#fff}
.sheet .sv{border:0;background:#9f2a37;color:#fff;font-weight:700;border-radius:10px;padding:0 18px;min-height:44px}
.sheet .rs{border:0;background:none;color:#9f2a37;font-size:.8rem;margin-top:8px;padding:6px 0;text-decoration:underline}
.sheet p{margin:6px 0 0;font-size:.74rem;color:#8a5a00}
.sheet .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:1.6rem;color:#888;line-height:1;min-width:40px;min-height:40px}
.note{font-size:.72rem;color:var(--sub);margin:14px 2px 0;line-height:1.7}
.note button{border:0;background:none;color:#fff;text-decoration:underline;padding:0;font-size:.72rem}
</style>
<header class="hd"><button class="back" id="mp-back" type="button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>戻る</button>
<div class="hdt"><b>店舗マップ（β版・AM川口のみ）</b><small id="mp-st">店舗番号 ――</small></div></header>
<main>
<div class="ttl">無印良品</div>
<p class="sub">イオンモール川口　売場図</p>
<div class="sr"><input id="mp-q" type="search" placeholder="売場の名称で探す（例：キッチン、こども）" aria-label="売場を探す"></div>
<div class="tools"><button type="button" id="mp-zo" aria-label="縮小">－</button><span id="mp-zv">180%</span><button type="button" id="mp-zi" aria-label="拡大">＋</button><button type="button" id="mp-pl" aria-pressed="false">図面を重ねる</button><small>売場をタップして名称を付けられます</small></div>
<div class="mw" id="mp-w"><svg class="map" id="mp-svg" viewBox="0 0 995 566" role="img" aria-label="売場図"></svg></div>
<p class="note">図面を読み取って区画に分けた、β版です（AM川口のみ）。売場をタップすると名称を付けたり変えたりできます。名称はこの端末に保存され、店舗番号ごとに分けて残ります。名称が「未設定」の区画は、図面に文字がなく判別できなかったところです。<br><button type="button" id="mp-all">すべての名称を初期に戻す</button></p>
</main>
<div class="sheet" id="mp-sh" hidden><button type="button" class="x" id="mp-x" aria-label="閉じる">×</button><h3>売場の名称</h3><div class="nm"><input id="mp-in" type="text" maxlength="24" aria-label="売場の名称" placeholder="名称を入れる"><button type="button" class="sv" id="mp-sv">保存</button></div><button type="button" class="rs" id="mp-rs">初期の名称に戻す</button><p id="mp-inf" hidden>※この名称は、図面の家具の配置から推測したものです。違うときは付け替えてください。</p></div>
<script>(function(){
var D=/*%%ZONES%%*/null,PLAN="%%PLAN%%";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var store="";function key(){return"mj-map-names-"+(store||"x")}
var NAMES={};
function load(){NAMES={};try{NAMES=JSON.parse(localStorage.getItem(key())||"{}")||{}}catch(e){NAMES={}}}
function save(){try{localStorage.setItem(key(),JSON.stringify(NAMES))}catch(e){}}
function nm(z){return NAMES[z.id]||z.n}
function cen(p){var x=0,y=0,a=0;for(var i=0;i<p.length;i++){var j=(i+1)%p.length,c=p[i][0]*p[j][1]-p[j][0]*p[i][1];a+=c;x+=(p[i][0]+p[j][0])*c;y+=(p[i][1]+p[j][1])*c}a/=2;return a?[x/(6*a),y/(6*a)]:p[0]}
function bb(p){var xs=p.map(function(q){return q[0]}),ys=p.map(function(q){return q[1]});return[Math.max.apply(0,xs)-Math.min.apply(0,xs),Math.max.apply(0,ys)-Math.min.apply(0,ys)]}
function draw(){var o=['<image id="mp-img" href="'+PLAN+'" x="0" y="0" width="995" height="566" opacity="0" />'];
 o.push('<polygon id="mp-ol" points="'+D.outline.map(function(p){return p.join(",")}).join(" ")+'" fill="#f1efef"/>');
 D.zones.forEach(function(z,i){var n=nm(z),c=cen(z.p),b=bb(z.p),fs=Math.min(14,b[0]*.9/n.length),lines=[n];
  if(fs<10&&n.length>4){var h=Math.ceil(n.length/2);lines=[n.slice(0,h),n.slice(h)];fs=Math.min(13,b[0]*.9/h)}
  fs=Math.max(7,fs);var lh=fs*1.15;
  o.push('<g class="zn'+(n==="未設定"?" un":"")+'" data-i="'+i+'" tabindex="0" role="button" aria-label="'+esc(n)+'"><polygon points="'+z.p.map(function(p){return p.join(",")}).join(" ")+'"/><text x="'+c[0].toFixed(1)+'" y="'+(c[1]-(lines.length-1)*lh/2+fs*.35).toFixed(1)+'" font-size="'+fs.toFixed(1)+'">'+lines.map(function(l,k){return'<tspan x="'+c[0].toFixed(1)+'" dy="'+(k?lh:0)+'">'+esc(l)+'</tspan>'}).join("")+'</text></g>')});
 $("mp-svg").innerHTML=o.join("");mark();syncPlan()}
var Z=window.innerWidth>=700?100:180,PL=false,sel=-1,q="";
function zoom(d){Z=Math.max(100,Math.min(400,Z+d));$("mp-svg").style.width=Z+"%";$("mp-zv").textContent=Z+"%"}
$("mp-svg").style.width=Z+"%";$("mp-zv").textContent=Z+"%";
$("mp-zi").onclick=function(){zoom(40)};$("mp-zo").onclick=function(){zoom(-40)};
function syncPlan(){var im=$("mp-img"),ol=$("mp-ol"),m=$("mp-svg");if(!im)return;im.setAttribute("opacity",PL?"1":"0");ol.setAttribute("opacity",PL?"0":"1");m.classList.toggle("ov",PL)}
$("mp-pl").onclick=function(){PL=!PL;this.classList.toggle("on",PL);this.setAttribute("aria-pressed",PL);syncPlan()};
function mark(){var w=q.replace(/　/g," ").trim().toLowerCase().split(/\s+/).filter(Boolean);
 document.querySelectorAll(".zn").forEach(function(g){var z=D.zones[+g.dataset.i],h=nm(z).toLowerCase(),ok=w.length&&w.every(function(x){return h.indexOf(x)>=0});
  g.classList.toggle("hit",!!ok);g.classList.toggle("dim",w.length>0&&!ok);g.classList.toggle("sel",+g.dataset.i===sel)})}
$("mp-q").addEventListener("input",function(){q=this.value;mark()});
function pick(i){sel=i;var z=D.zones[i];$("mp-in").value=nm(z)==="未設定"?"":nm(z);$("mp-inf").hidden=!(z.inf&&!NAMES[z.id]);$("mp-sh").hidden=false;mark()}
$("mp-svg").addEventListener("click",function(e){var g=e.target.closest(".zn");if(g)pick(+g.dataset.i)});
$("mp-svg").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){var g=e.target.closest&&e.target.closest(".zn");if(g){e.preventDefault();pick(+g.dataset.i)}}});
function close(){$("mp-sh").hidden=true;sel=-1;mark()}
$("mp-x").onclick=close;
function commit(){if(sel<0)return;var z=D.zones[sel],v=$("mp-in").value.trim();if(!v||v===z.n)delete NAMES[z.id];else NAMES[z.id]=v;save();draw();close()}
$("mp-sv").onclick=commit;$("mp-in").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();commit()}});
$("mp-rs").onclick=function(){if(sel<0)return;delete NAMES[D.zones[sel].id];save();draw();close()};
$("mp-all").onclick=function(){if(confirm("すべての売場の名称を初期に戻します。よろしいですか？")){NAMES={};save();draw()}};
function setStore(n){if(/^\d{6}$/.test(String(n||""))){store=String(n);$("mp-st").textContent="店舗番号 "+n;load();draw()}}
try{setStore(localStorage.getItem("mj-store"))}catch(e){}
load();draw();
window.addEventListener("message",function(e){var d=e.data||{};if(d.mj==="store")setStore(d.no)});
function tell(m){try{parent.postMessage({mj:m},"*")}catch(e){}}
$("mp-back").addEventListener("click",function(){tell("sub-close")});tell("sub-ready");
})();</script>
