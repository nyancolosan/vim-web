<title>オーダー収納の見積り</title>
<style>
/* 骨格は IDEE・素材図鑑と同じ（白地・エンジ） */
:root{
  --bg:#ffffff;--card:#ffffff;--ink:#333333;--sub:#7d7778;--line:#e3dfdf;--fill:#ffffff;
  --acc:#9f2a37;--accink:#ffffff;--accbg:#f9eef0;--ok:#4f6b45;--warn:#9a5b00;--shadow:rgba(60,30,35,.05);
  --rc:8px;color-scheme:light;
  --f-body:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
main{max-width:720px;margin:0 auto;padding:0 16px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.35}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header.hd{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:58px}
.back{display:flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:999px;min-height:40px;padding:0 14px 0 8px;font-weight:700;font-size:.85rem}
.hdt{margin-left:auto;text-align:right;line-height:1.25}
.hdt b{display:block;font-size:.95rem;letter-spacing:.04em}
.hdt small{color:var(--sub);font-size:.7rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--sub);min-height:44px;font-size:.82rem;padding:0 4px;line-height:1.25}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--accink);font-weight:700}
.top{margin-top:14px}
.q{margin-top:16px}
.q h3{font-size:.86rem;margin:0 0 6px;display:flex;align-items:baseline;gap:6px}
.q h3 i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--accink);font-size:.72rem;flex:none}
.q h3 small{color:var(--sub);font-weight:400;font-size:.72rem}
.num{display:flex;align-items:center;gap:8px}
.num input{width:120px;font-size:20px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-align:right;font-variant-numeric:tabular-nums}
.num span{color:var(--sub);font-size:.85rem}
.hint{font-size:.76rem;color:var(--sub);margin:6px 0 0}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.step button{border:0;background:var(--card);width:44px;height:40px;font-size:1.2rem;color:var(--acc)}
.step output{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.step+small{margin-left:8px;color:var(--sub);font-size:.76rem}
select{font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--fill);min-width:140px}
.res{margin-top:20px;border:1px solid var(--line);border-radius:var(--rc);box-shadow:0 1px 3px var(--shadow);padding:12px 14px}
.res h2{font-size:.9rem;margin:0 0 8px}
.err{color:var(--acc);font-weight:700;font-size:.9rem;margin:0}
.dims{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.82rem;margin:0 0 6px;padding:8px 10px;background:var(--accbg);border-radius:6px}
.dims dt{color:var(--sub)}
.dims dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dims dd.big{color:var(--acc);font-size:1rem}
.ln{border-top:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.84rem}
.ln b{font-weight:600}
.ln .pr{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .sb{grid-column:1/-1;color:var(--sub);font-size:.74rem}
.tag{display:inline-block;font-size:.66rem;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px}
.tag.o{border-color:var(--warn);color:var(--warn)}
.tot{border-top:2px solid var(--ink);margin-top:2px;padding-top:8px;display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.tot span:last-child{font-size:1.3rem;font-variant-numeric:tabular-nums}
.notes{margin:10px 0 0;padding-left:1.2em;font-size:.76rem;color:var(--sub)}
.cp{display:block;width:100%;margin-top:14px;min-height:48px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font-weight:700}
textarea.cpt{width:100%;margin-top:8px;font-size:13px;min-height:160px;border:1px solid var(--line);border-radius:8px;padding:8px}
.foot{font-size:.72rem;color:var(--sub);margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:999px;font-size:.84rem;z-index:9}
</style>
<main>
<header class="hd">
  <button class="back" id="sh-back" type="button" aria-label="住空間のメニューに戻る"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>戻る</button>
  <span class="hdt"><b>オーダー収納の見積り</b><small>idea・住空間</small></span>
</header>
<div class="seg top" id="kind" role="tablist">
  <button type="button" data-v="sus" class="on" role="tab">SUS 追加棚<br><small>幅オーダー</small></button>
  <button type="button" data-v="stk" role="tab">スタッキング<br><small>シェルフ</small></button>
</div>

<section id="p-sus">
  <div class="q"><h3><i>1</i>サイズの決め方</h3>
    <div class="seg" id="s-mode">
      <button type="button" data-v="place" class="on">置きたい<br>場所の幅</button>
      <button type="button" data-v="item">入れたい<br>物の幅</button>
      <button type="button" data-v="actual">棚板の<br>実寸</button>
    </div>
    <div class="num" style="margin-top:10px"><input id="s-w" type="text" inputmode="decimal" placeholder="例 70" aria-label="幅（cm）"><span>cm</span></div>
    <p class="hint" id="s-hint"></p>
  </div>
  <div class="q"><h3><i>2</i>材</h3>
    <div class="seg" id="s-wood"><button type="button" data-v="oak" class="on">オーク材</button><button type="button" data-v="walnut">ウォールナット材</button></div>
  </div>
  <div class="q"><h3><i>3</i>帆立のサイズ<small>お持ちのシェルフの帆立</small></h3>
    <div class="seg" id="s-frame"><button type="button" data-v="small" class="on">小</button><button type="button" data-v="medium">中</button><button type="button" data-v="large">大</button><button type="button" data-v="xlarge">特大</button></div>
  </div>
  <div class="q"><h3><i>4</i>枚数</h3>
    <div class="step" data-k="sn"><button type="button" data-d="-1" aria-label="減らす">−</button><output id="s-n">1</output><button type="button" data-d="1" aria-label="増やす">＋</button></div>
  </div>
  <div class="res" id="s-res" aria-live="polite"></div>
</section>

<section id="p-stk" hidden>
  <div class="q"><h3><i>1</i>幅</h3>
    <div class="seg" id="k-size"><button type="button" data-v="slim" class="on">スリム</button><button type="button" data-v="regular">レギュラー</button><button type="button" data-v="wide">ワイド</button></div>
  </div>
  <div class="q"><h3><i>2</i>奥行</h3>
    <div class="seg" id="k-depth"><button type="button" data-v="28.5" class="on">28.5cm</button><button type="button" data-v="40">40cm</button></div>
  </div>
  <div class="q"><h3><i>3</i>材</h3>
    <div class="seg" id="k-wood"><button type="button" data-v="oak" class="on">オーク材</button><button type="button" data-v="walnut">ウォールナット材</button></div>
  </div>
  <div class="q"><h3><i>4</i>高さ</h3>
    <div class="seg" id="k-hmode"><button type="button" data-v="tier" class="on">段数で選ぶ</button><button type="button" data-v="height">高さをオーダー</button></div>
    <div class="seg" id="k-tier" style="margin-top:8px"></div>
    <div id="k-hwrap" hidden style="margin-top:8px"><select id="k-h" aria-label="高さ"></select><p class="hint">変則6段（239.5cm）から2cm刻みで低くできます。</p></div>
  </div>
  <div class="q"><h3><i>5</i>横につなぐ追加セット</h3>
    <div class="step" data-k="ka"><button type="button" data-d="-1" aria-label="減らす">−</button><output id="k-a">0</output><button type="button" data-d="1" aria-label="増やす">＋</button></div><small id="k-cols"></small>
  </div>
  <div class="res" id="k-res" aria-live="polite"></div>
</section>

<button type="button" class="cp" id="copy">見積りをコピー</button>
<textarea class="cpt" id="cpt" hidden readonly aria-label="見積りの文章"></textarea>
<p class="foot" id="foot"></p>
</main>
<script>
(function(){
var D=/* %%SHELF%% */ null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function yen(n){return"¥"+Number(n).toLocaleString("ja-JP")}
function cm(n){return(Math.round(n*10)/10).toFixed(1).replace(/\.0$/,"")+"cm"}
function today(){var d=new Date();return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()}
var WOOD={oak:"オーク材",walnut:"ウォールナット材"},FRAME={small:"小",medium:"中",large:"大",xlarge:"特大"},
    SIZE={slim:"スリム",regular:"レギュラー",wide:"ワイド"},CB={S:"small",M:"medium",L:"large"},SHIP=["","①","②","③","④"];
var S={kind:"sus",mode:"place",w:"",wood:"oak",frame:"small",sn:1,size:"slim",depth:"28.5",kwood:"oak",hmode:"tier",tier:6,h:239.5,ka:0};
var lines=[],total=0,head="";

function seg(id,key,after){$(id).addEventListener("click",function(e){var b=e.target.closest("button");if(!b||b.disabled)return;
  S[key]=key==="tier"?Number(b.dataset.v):b.dataset.v;mark(id,b.dataset.v);if(after)after();draw()})}
function mark(id,v){[].forEach.call($(id).querySelectorAll("button"),function(x){x.classList.toggle("on",x.dataset.v===String(v))})}

/* ---------- SUS 追加棚 ---------- */
var HINT={place:"シェルフを置きたいすき間の幅。脚の外〜外がこの幅に収まる棚板を出します。",
          item:"シェルフの中に入れたい物の幅。帆立の内側（有効内寸）に収まる棚板を出します。",
          actual:"棚板の実寸（金具なし）を 25〜81cm・1cm単位で。"};
function susActual(){var v=parseFloat(String(S.w).replace(/[^\d.]/g,""));if(!isFinite(v))return null;
  var o=D.sus.dimensionOffsets;
  if(S.mode==="place")return Math.floor(v-o.legOuter_1+1e-9);
  if(S.mode==="item")return Math.ceil(v-o.innerClear_5-1e-9);
  return Math.round(v)}
function drawSus(){
  $("s-hint").textContent=HINT[S.mode];
  var a=susActual(),box=$("s-res");lines=[];total=0;head="";
  if(a===null){box.innerHTML='<p class="hint" style="margin:0">幅を入れると金額が出ます。</p>';return}
  if(a<25||a>81){box.innerHTML='<p class="err">棚板実寸 '+a+'cm はオーダーできる範囲（25〜81cm）の外です。</p>';return}
  var o=D.sus.dimensionOffsets,band=D.sus.widthBands.filter(function(b){return a>=b.min&&a<=b.max})[0],p=band[S.wood];
  var cbk=CB[D.sus.crossbarTypeByWidth[String(a)][S.frame]],cb=D.sus.crossbars[cbk],cq=D.sus.crossbarQtyByFrame[S.frame]*S.sn;
  head="SUS追加棚 "+WOOD[S.wood]+" 棚板実寸"+a+"cm／帆立・"+FRAME[S.frame];
  lines=[{n:"受Ｓ－ＳＵＳ追加棚 "+WOOD[S.wood]+" 幅"+band.min+"〜"+band.max+"cm",j:p.jan,u:p.price,q:S.sn,sb:"棚板実寸 "+a+"cm でオーダー"},
         {n:cb.name,j:cb.jan,u:cb.price,q:cq,sb:"帆立・"+FRAME[S.frame]+"は1枚につき"+D.sus.crossbarQtyByFrame[S.frame]+"本",st:cb.stock}];
  var h='<h2>'+esc(head)+'</h2><dl class="dims">'+
   '<dt>① 脚 外〜外</dt><dd'+(S.mode==="place"?' class="big"':'')+'>'+cm(a+o.legOuter_1)+'</dd>'+
   '<dt>② 帆立 外〜外</dt><dd>'+cm(a+o.frameOuter_2)+'</dd>'+
   '<dt>③ 棚板（金具 外〜外）</dt><dd>'+cm(a+o.shelfWithBracket_3)+'</dd>'+
   '<dt>④ 棚板実寸</dt><dd'+(S.mode==="actual"?' class="big"':'')+'>'+cm(a)+'</dd>'+
   '<dt>⑤ 有効内寸</dt><dd'+(S.mode==="item"?' class="big"':'')+'>'+cm(a+o.innerClear_5)+'</dd></dl>';
  box.innerHTML=h+lineHtml()}

/* ---------- スタッキングシェルフ ---------- */
function find(set,tiers,otype){return D.stacking.items.filter(function(r){return r.order_type===otype&&r.size===S.size&&r.set===set&&r.wood===S.kwood&&String(r.depth_cm)===String(Number(S.depth))&&r.tiers===tiers})[0]}
function heights(){var o=[],m=D.stacking.heightOrder;for(var h=m.maxCm;h>=42-1e-9;h=Math.round((h-m.stepCm)*10)/10)o.push(h);return o}
function drawTiers(){var g=$("k-tier");g.innerHTML=[1,2,3,4,5,6].map(function(t){var ok=!!find("basic",String(t),"tier");
   return'<button type="button" data-v="'+t+'"'+(ok?"":" disabled")+'>'+t+'段</button>'}).join("");
  if(!find("basic",String(S.tier),"tier")){S.tier=6}mark("k-tier",S.tier)}
function drawStk(){
  $("k-tier").hidden=S.hmode!=="tier";$("k-hwrap").hidden=S.hmode!=="height";
  var tiers=S.hmode==="tier"?String(S.tier):"6v",ot=S.hmode==="tier"?"tier":"height";
  var b=find("basic",tiers,ot),ad=S.ka?find("add",tiers,ot):null,box=$("k-res");lines=[];total=0;head="";
  $("k-cols").textContent="全部で "+(1+S.ka)+" 列";
  if(!b||(S.ka&&!ad)){box.innerHTML='<p class="err">この組み合わせはオーダー商品がありません。</p>';return}
  var hgt=S.hmode==="tier"?b.height_cm:Number(S.h),tl=S.hmode==="tier"?S.tier+"段":"変則6段・高さ"+cm(hgt);
  function nm(r){return"オーダースタッキングシェルフ "+(r.set==="basic"?"基本":"追加")+"セット・"+SIZE[S.size]+(S.depth==="40"?"・奥行40":"")+"・"+tl+"・"+WOOD[S.kwood]}
  head="スタッキングシェルフ "+SIZE[S.size]+"・奥行"+S.depth+"cm・"+tl+"・"+WOOD[S.kwood]+"・"+(1+S.ka)+"列";
  lines.push({n:nm(b),j:b.jan,u:b.price,q:1,sb:"幅"+cm(b.width_cm)+"×奥行"+cm(b.depth_cm)+"×高さ"+cm(hgt)+"・配送サイズ"+SHIP[b.ship_size]});
  if(ad)lines.push({n:nm(ad),j:ad.jan,u:ad.price,q:S.ka,sb:"幅"+cm(ad.width_cm)+"×奥行"+cm(ad.depth_cm)+"×高さ"+cm(hgt)+"・配送サイズ"+SHIP[ad.ship_size]});
  if(1+S.ka>=5)lines.push({n:"組立費（5列以上）",j:"",u:D.stacking.assembly.fiveColumnsOrMore,q:1,sb:"条件は店舗で確認してください"});
  var W=b.width_cm+(ad?ad.width_cm*S.ka:0);
  var h='<h2>'+esc(head)+'</h2><dl class="dims"><dt>全体の幅</dt><dd class="big">'+cm(W)+'</dd><dt>奥行</dt><dd>'+cm(b.depth_cm)+'</dd><dt>高さ</dt><dd>'+cm(hgt)+'</dd></dl>';
  box.innerHTML=h+lineHtml()+'<ul class="notes">'+D.stacking.notes.map(function(n){return"<li>"+esc(n)+"</li>"}).join("")+'</ul>'}

function lineHtml(){total=0;return lines.map(function(l){var s=l.u*l.q;total+=s;
   return'<div class="ln"><b>'+esc(l.n)+(l.st?'<span class="tag'+(l.st==="受注品"?" o":"")+'">'+esc(l.st)+'</span>':"")+'</b><span class="pr">'+yen(s)+'</span>'+
    '<span class="sb">'+(l.j?"JAN "+esc(l.j)+"　":"")+yen(l.u)+" × "+l.q+"　"+esc(l.sb||"")+'</span></div>'}).join("")+
   '<div class="tot"><span>合計（税込）</span><span>'+yen(total)+'</span></div>'}

function draw(){$("p-sus").hidden=S.kind!=="sus";$("p-stk").hidden=S.kind!=="stk";if(S.kind==="sus")drawSus();else{drawTiers();drawStk()}
  $("copy").disabled=!lines.length;$("cpt").hidden=true}

function qText(){var t="【オーダー収納 見積り】"+today()+"\n"+head+"\n";
  lines.forEach(function(l){t+="・"+l.n+(l.j?"（JAN "+l.j+"）":"")+"\n　"+yen(l.u)+" × "+l.q+" ＝ "+yen(l.u*l.q)+"\n"});
  return t+"合計 "+yen(total)+"（税込）\n※価格は資料作成時点のものです"}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}
$("copy").addEventListener("click",function(){var t=qText(),ta=$("cpt");ta.value=t;
  function fb(){ta.hidden=false;ta.focus();ta.select();toast("下の文章を長押ししてコピーしてください")}
  try{navigator.clipboard.writeText(t).then(function(){toast("コピーしました")},fb)}catch(e){fb()}});

seg("kind","kind");seg("s-mode","mode");seg("s-wood","wood");seg("s-frame","frame");
seg("k-size","size");seg("k-depth","depth");seg("k-wood","kwood");seg("k-hmode","hmode");seg("k-tier","tier");
$("s-w").addEventListener("input",function(){S.w=this.value;draw()});
$("k-h").innerHTML=heights().map(function(h){return'<option value="'+h+'">'+cm(h)+'</option>'}).join("");
$("k-h").addEventListener("change",function(){S.h=this.value;draw()});
[].forEach.call(document.querySelectorAll(".step"),function(st){st.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  var k=st.dataset.k,v=S[k]+Number(b.dataset.d);S[k]=k==="sn"?Math.max(1,Math.min(20,v)):Math.max(0,Math.min(9,v));$(k==="sn"?"s-n":"k-a").textContent=S[k];draw()})});
$("foot").textContent="価格は MUJIGRAM「15応対（生活雑貨）」の資料（SUS：2025年4月更新、スタッキングシェルフ：2019年4月更新）にもとづきます。最新の価格は売場・ネットストアで確認してください。";
draw();
function tell(m){try{parent.postMessage({mj:m},"*")}catch(e){}}
$("sh-back").addEventListener("click",function(){tell("sub-close")});tell("sub-ready");
})();
</script>
