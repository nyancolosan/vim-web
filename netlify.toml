[build]
  publish = "."
  command = "node _dev/fetch-models.mjs"  # 観葉植物の3Dモデル（Poly Haven・CC0）を取ってきて models/ に置く

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 開発用の元ファイル（_dev）は公開しない
[[redirects]]
  from = "/_dev/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
