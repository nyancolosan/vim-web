[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 管理画面
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

# 開発用の元ファイル（_dev）は公開しない
[[redirects]]
  from = "/_dev/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
